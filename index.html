<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sanjus web - Bike Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="intro-screen">
    <h1 class="zoom-text">Welcome to Bike Zone 🏍️</h1>
  </div>

  <main class="content hidden" id="main-content">
    <header>
      <h2>Featured Bikes</h2>
    </header>

    <div class="bike-container">
      <div class="bike-card">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500" alt="Superbike">
        <h3>Yamaha R15 V4</h3>
        <p class="price">Price: ₹1,82,000</p>
        <ul>
          <li><strong>Engine:</strong> 155 cc</li>
          <li><strong>Power:</strong> 18.4 PS</li>
          <li><strong>Mileage:</strong> 45 kmpl</li>
        </ul>
      </div>

      <div class="bike-card">
        <img src="https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=500" alt="Classic Bike">
        <h3>Royal Enfield Classic 350</h3>
        <p class="price">Price: ₹1,93,000</p>
        <ul>
          <li><strong>Engine:</strong> 349 cc</li>
          <li><strong>Power:</strong> 20.2 bhp</li>
          <li><strong>Mileage:</strong> 35 kmpl</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
